<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#122b45">
  <title>Admin | Dhruvo Express</title>
  <link rel="icon" type="image/png" href="../assets/dhruvo-express-mark.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #f2f6fa;
      color: #203449;
      font-family: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
    }
    .admin-gate {
      max-width: 460px;
      margin: 24px;
      padding: 26px 24px;
      border: 1px solid #dde7ee;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(23, 62, 91, .08);
      text-align: center;
    }
    .admin-gate img { width: 92px; height: auto; }
    .admin-gate h1 { margin: 14px 0 6px; font-size: 20px; font-weight: 850; }
    .admin-gate p { margin: 0; color: #66788a; font-size: 13px; line-height: 1.75; }
    .admin-gate code { padding: 1px 6px; border-radius: 6px; background: #eef4f8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="admin-gate" id="admin-gate">
    <img src="../assets/dhruvo-express-mark.png" alt="Dhruvo Express" width="495" height="307">
    <h1>Dhruvo Express Admin</h1>
    <p>লোড হচ্ছে… কিছু দেখা না গেলে ইন্টারনেট বা <code>admin/config.yml</code>-এর backend সেটিং চেক করুন।</p>
  </div>

  <!-- git-gateway (Netlify Identity) ব্যবহার হলে এই উইজেটটি লাগবে -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    // Netlify Identity লগইনের পর আবার অ্যাডমিনে ফেরত আনা
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () {
            document.location.href = document.location.pathname;
          });
        }
      });
    }
    // CMS লোড হয়ে গেলে গেট-মেসেজটি সরিয়ে দেওয়া
    window.addEventListener('load', function () {
      window.setTimeout(function () {
        var gate = document.getElementById('admin-gate');
        if (gate) gate.remove();
      }, 1200);
    });
  </script>
</body>
</html>
