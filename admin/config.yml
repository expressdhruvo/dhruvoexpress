# Dhruvo Express — Decap CMS কনফিগারেশন
# বিস্তারিত বাংলা সেটআপ গাইড: README-ADMIN-BN.md

backend:
  name: git-gateway
  branch: main

# ─────────────────────────────────────────────────────────────
# বিকল্প: Netlify ছাড়া সরাসরি GitHub দিয়ে লগইন করতে চাইলে
# (Netlify সাইটে GitHub OAuth provider ইনস্টল করা থাকতে হবে)
# উপরের backend ব্লক কমেন্ট করে নিচেরটি ব্যবহার করুন:
#
# backend:
#   name: github
#   repo: expressdhruvo/dhruvoexpress
#   branch: main
#   site_domain: expressdhruvo.github.io
#   base_url: https://api.netlify.com
# ─────────────────────────────────────────────────────────────

media_folder: "assets/uploads"
public_folder: "/dhruvoexpress/assets/uploads"
publish_mode: simple

collections:
  # ── ১. পণ্য ────────────────────────────────────────────────
  - name: "products"
    label: "🛒 পণ্য"
    files:
      - name: "products"
        label: "সব পণ্য"
        file: "content/products.json"
        description: "দাম, নাম, বিবরণ, ক্যাটাগরি, সাব-ক্যাটাগরি, ছবির ট্যাগ—সব এখান থেকে বদলান। নতুন পণ্য যোগ করতে “Add” চাপুন, মুছতে ট্র্যাশ আইকন।"
        fields:
          - name: "products"
            label: "পণ্যের তালিকা"
            widget: "list"
            fields:
              - name: "id"
                label: "পণ্যের আইডি (ইংরেজি, ফাঁকা ছাড়া, একক)"
                widget: "string"
                hint: "যেমন: rice-miniket। কার্টে এই আইডি দিয়ে পণ্য ধরা হয়, তাই পুরনো পণ্যের আইডি বদলাবেন না।"
              - name: "name"
                label: "পণ্যের নাম"
                widget: "string"
              - name: "detail"
                label: "প্যাক/সাইজের বিবরণ"
                widget: "string"
                hint: "যেমন: ৫ কেজি প্যাক"
              - name: "price"
                label: "দাম (টাকায়, শুধু সংখ্যা)"
                widget: "number"
                value_type: "int"
                min: 0
              - name: "category"
                label: "মেইন ক্যাটাগরি আইডি"
                widget: "string"
                hint: "ক্যাটাগরি পেজে দেওয়া id ব্যবহার করুন, যেমন: gas বা grocery"
              - name: "subcategory"
                label: "সাব-ক্যাটাগরি আইডি (ঐচ্ছিক)"
                widget: "string"
                required: false
                hint: "ক্যাটাগরি পেজের সাব-ক্যাটাগরি id, যেমন: rice। ফাঁকা রাখলে শুধু মেইন ক্যাটাগরিতে দেখাবে।"
              - name: "badge"
                label: "ছবির ওপরের ট্যাগ (ঐচ্ছিক)"
                widget: "string"
                required: false
                hint: "যেমন: জনপ্রিয় / বাজারের পছন্দ। ফাঁকা রাখলে কোনো ট্যাগ দেখাবে না—এভাবেই ট্যাগ মুছে ফেলা যায়।"
              - name: "deliveryWeightKg"
                label: "প্যাকের আনুমানিক ওজন (কেজি)"
                widget: "number"
                value_type: "float"
                required: false
                hint: "ডেলিভারি চার্জ হিসেবে ব্যবহৃত। LPG-র gross weight না জানলে ফাঁকা রাখুন—তখন WhatsApp কোট চাইবে।"
              - name: "icon"
                label: "ফলব্যাক আইকন (ইমোজি)"
                widget: "string"
                required: false
              - name: "image"
                label: "ছবির পথ (JPG/PNG)"
                widget: "string"
                hint: "যেমন: assets/products/rice-miniket.jpg"
              - name: "imageWebp"
                label: "ছবির WebP পথ (ঐচ্ছিক)"
                widget: "string"
                required: false
              - name: "imageAlt"
                label: "ছবির বর্ণনা (স্ক্রিন-রিডার)"
                widget: "string"
                required: false
              - name: "imageLabel"
                label: "ছবির লেবেল"
                widget: "string"
                required: false
                hint: "ব্র্যান্ডের ছবি / প্রতিনিধি ছবি"
              - name: "imageFit"
                label: "ছবি ফিট"
                widget: "select"
                options: ["cover", "contain"]
                default: "cover"
              - name: "visual"
                label: "থাম্বনেইল স্টাইল"
                widget: "string"
                required: false
                hint: "gas / rice / oil / lentil / flour / sugar / salt / potato / grocery"

  # ── ২. ক্যাটাগরি ───────────────────────────────────────────
  - name: "categories"
    label: "🗂 ক্যাটাগরি"
    files:
      - name: "categories"
        label: "মেইন ও সাব ক্যাটাগরি"
        file: "content/categories.json"
        description: "নতুন মেইন ক্যাটাগরি যোগ করতে নিচের তালিকায় Add করুন। সাব-ক্যাটাগরি সেখানেই যোগ/মুছুন। “সব পণ্য” বোতামটি সাইট নিজে তৈরি করে।"
        fields:
          - name: "categories"
            label: "ক্যাটাগরি"
            widget: "list"
            fields:
              - name: "id"
                label: "ক্যাটাগরি আইডি (ইংরেজি)"
                widget: "string"
                hint: "যেমন: gas / grocery। পণ্যের category ফিল্ডে এই id বসাতে হবে।"
              - name: "label"
                label: "ক্যাটাগরির নাম (বোতামে দেখাবে)"
                widget: "string"
              - name: "subcategories"
                label: "সাব-ক্যাটাগরি"
                widget: "list"
                required: false
                fields:
                  - name: "id"
                    label: "সাব-ক্যাটাগরি আইডি"
                    widget: "string"
                  - name: "label"
                    label: "সাব-ক্যাটাগরির নাম"
                    widget: "string"

  # ── ৩. ফ্ল্যাশ সেল ─────────────────────────────────────────
  - name: "flash_sale"
    label: "⚡ ফ্ল্যাশ সেল"
    files:
      - name: "flash_sale"
        label: "আজকের অফার"
        file: "content/flash-sale.json"
        description: "চালু করতে enabled অন করুন, পণ্যের id ও সেল-দাম দিন। শুধু তখনই চালু করুন যখন অফার আসল।"
        fields:
          - name: "enabled"
            label: "ফ্ল্যাশ সেল চালু?"
            widget: "boolean"
            default: false
          - name: "title"
            label: "শিরোনাম"
            widget: "string"
          - name: "note"
            label: "ছোট নোট"
            widget: "string"
          - name: "productId"
            label: "পণ্যের আইডি"
            widget: "string"
            hint: "পণ্য তালিকার id, যেমন: rice-miniket"
          - name: "salePrice"
            label: "সেল দাম (টাকা)"
            widget: "number"
            value_type: "int"
          - name: "endTime"
            label: "শেষ সময় (বাংলাদেশ সময়)"
            widget: "string"
            hint: "ফরম্যাট: HH:MM:SS — যেমন 23:59:59"
          - name: "ctaText"
            label: "বাটনের লেখা"
            widget: "string"

  # ── ৪. সাধারণ সেটিংস ───────────────────────────────────────
  - name: "settings"
    label: "⚙️ সাধারণ সেটিংস"
    files:
      - name: "settings"
        label: "দোকান, হিরো, টিকার ও ডেলিভারি"
        file: "content/settings.json"
        fields:
          - name: "store"
            label: "দোকানের তথ্য"
            widget: "object"
            fields:
              - name: "name"
                label: "দোকানের নাম"
                widget: "string"
              - name: "tagline"
                label: "বাংলা নাম"
                widget: "string"
              - name: "whatsappNumber"
                label: "WhatsApp নম্বর (দেশের কোডসহ, + ছাড়া)"
                widget: "string"
                hint: "যেমন: 8801619831653"
              - name: "paymentDisplayNumber"
                label: "পেমেন্ট নম্বর (দেখানোর ফরম্যাট)"
                widget: "string"
                hint: "যেমন: +8801619831653"
              - name: "email"
                label: "ইমেইল"
                widget: "string"
              - name: "area"
                label: "এলাকা"
                widget: "string"
          - name: "hero"
            label: "হিরো সেকশন"
            widget: "object"
            fields:
              - name: "kicker"
                label: "উপরের লাইন"
                widget: "string"
                hint: "| দিয়ে ভাগ করুন, যেমন: Fast Local Delivery | Chattogram"
              - name: "title"
                label: "শিরোনাম (প্রথম লাইন)"
                widget: "string"
              - name: "titleEm"
                label: "শিরোনাম (রঙিন লাইন)"
                widget: "string"
              - name: "description"
                label: "বিবরণ"
                widget: "text"
          - name: "ticker"
            label: "উপরে ঘোরানো আপডেট/অফার বার"
            widget: "list"
            fields:
              - name: "label"
                label: "লেবেল"
                widget: "string"
              - name: "text"
                label: "বার্তা"
                widget: "string"
          - name: "delivery"
            label: "ডেলিভারি চার্জ"
            widget: "object"
            fields:
              - name: "tiers"
                label: "ওজনভিত্তিক চার্জ"
                widget: "list"
                fields:
                  - name: "maxKg"
                    label: "সর্বোচ্চ ওজন (কেজি)"
                    widget: "number"
                    value_type: "float"
                  - name: "fee"
                    label: "চার্জ (টাকা)"
                    widget: "number"
                    value_type: "int"
              - name: "maximumOnlineWeightKg"
                label: "অনলাইনে সর্বোচ্চ ওজন (কেজি)"
                widget: "number"
                value_type: "float"
                hint: "এর সমান বা বেশি হলে অনলাইন চেকআউট বন্ধ"
          - name: "pricing"
            label: "দাম প্রকাশ"
            widget: "object"
            fields:
              - name: "verified"
                label: "সাইটে দাম দেখাবে?"
                widget: "boolean"
                hint: "বন্ধ করলে সব জায়গায় “WhatsApp-এ যাচাই করুন” দেখাবে।"
          - name: "footerNote"
            label: "ফুটার নোট"
            widget: "string"

  # ── ৫. সাইটের লেখা ─────────────────────────────────────────
  - name: "sections"
    label: "📝 সাইটের লেখা"
    files:
      - name: "sections"
        label: "সেকশন, ধাপ, প্রশ্ন-উত্তর"
        file: "content/sections.json"
        description: "হিরোর নিচের সুবিধা, ৩ ধাপের অর্ডার, কভারেজ এরিয়া, প্রশ্ন-উত্তর ও সেকশনের শিরোনাম—সব এখান থেকে বদলান।"
        fields:
          - name: "quickValues"
            label: "সুবিধা (৩টি)"
            widget: "list"
            fields:
              - name: "icon"
                label: "আইকন/চিহ্ন"
                widget: "string"
              - name: "title"
                label: "শিরোনাম"
                widget: "string"
              - name: "text"
                label: "বিবরণ"
                widget: "string"
          - name: "steps"
            label: "অর্ডারের ধাপ"
            widget: "list"
            fields:
              - name: "number"
                label: "নম্বর"
                widget: "string"
              - name: "icon"
                label: "চিহ্ন"
                widget: "string"
              - name: "title"
                label: "শিরোনাম"
                widget: "string"
              - name: "text"
                label: "বিবরণ"
                widget: "string"
          - name: "faqs"
            label: "প্রশ্ন ও উত্তর"
            widget: "list"
            fields:
              - name: "question"
                label: "প্রশ্ন"
                widget: "string"
              - name: "answer"
                label: "উত্তর"
                widget: "text"
          - name: "services"
            label: "সার্ভিস সেকশন"
            widget: "object"
            fields:
              - name: "eyebrow"
                label: "ছোট লেখা"
                widget: "string"
              - name: "title"
                label: "শিরোনাম (প্রথম লাইন)"
                widget: "string"
              - name: "titleEm"
                label: "শিরোনাম (রঙিন লাইন)"
                widget: "string"
              - name: "intro"
                label: "ভূমিকা"
                widget: "text"
          - name: "shop"
            label: "পণ্য সেকশন"
            widget: "object"
            fields:
              - name: "eyebrow"
                label: "ছোট লেখা"
                widget: "string"
              - name: "title"
                label: "শিরোনাম (প্রথম লাইন)"
                widget: "string"
              - name: "titleEm"
                label: "শিরোনাম (রঙিন লাইন)"
                widget: "string"
              - name: "intro"
                label: "ভূমিকা"
                widget: "text"
              - name: "catalogNote"
                label: "দাম সংক্রান্ত নোট"
                widget: "text"
          - name: "coverage"
            label: "কভারেজ/এলাকা সেকশন"
            widget: "object"
            fields:
              - name: "eyebrow"
                label: "ছোট লেখা"
                widget: "string"
              - name: "title"
                label: "শিরোনাম (প্রথম লাইন)"
                widget: "string"
              - name: "titleEm"
                label: "শিরোনাম (রঙিন লাইন)"
                widget: "string"
              - name: "body"
                label: "বিবরণ"
                widget: "text"
              - name: "areaName"
                label: "ম্যাপে দেখানো এলাকার নাম"
                widget: "string"
              - name: "areaNote"
                label: "ম্যাপের ছোট নোট"
                widget: "string"
              - name: "buttonText"
                label: "বাটনের লেখা"
                widget: "string"
          - name: "faqIntro"
            label: "প্রশ্ন-উত্তর সেকশনের ভূমিকা"
            widget: "object"
            fields:
              - name: "eyebrow"
                label: "ছোট লেখা"
                widget: "string"
              - name: "title"
                label: "শিরোনাম (প্রথম লাইন)"
                widget: "string"
              - name: "titleEm"
                label: "শিরোনাম (রঙিন লাইন)"
                widget: "string"
              - name: "body"
                label: "বিবরণ"
                widget: "text"
          - name: "contact"
            label: "যোগাযোগ সেকশন"
            widget: "object"
            fields:
              - name: "eyebrow"
                label: "ছোট লেখা"
                widget: "string"
              - name: "title"
                label: "শিরোনাম (প্রথম লাইন)"
                widget: "string"
              - name: "titleEm"
                label: "শিরোনাম (রঙিন লাইন)"
                widget: "string"
              - name: "body"
                label: "বিবরণ"
                widget: "text"
